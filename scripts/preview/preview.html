<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="overlay"></div>
  <div id="modal"></div>
  <div id="toast"></div>
  <script>
    // socket.io giả để xem giao diện không cần server game
    const handlers = {};
    window.io = () => ({ on: (e, f) => { handlers[e] = f; }, emit: () => {} });
    window.addEventListener('error', (e) => { document.title = 'ERR ' + e.message; });
    // ?lang=en: xem trước bản tiếng Anh (app.js đọc ngôn ngữ từ localStorage khi tải)
    try { localStorage.setItem('citadels-lang', /[?&]lang=en/.test(location.search) ? 'en' : 'vi'); } catch (_) {}
  </script>
  <script src="states.js"></script>
  <script src="icons.js"></script>
  <script src="voice.js"></script>
  <script src="sfx.js"></script>
  <script src="app.js"></script>
  <script type="module" src="city3d.js"></script>
  <script>
    const which = location.hash.slice(1) || 'turn';
    DISTRICT_DATA = window.CARDS;
    const tabM = which.match(/^rules-([a-z]+)$/);
    if (tabM) { handlers.state(STATES.turn); ui.rulesOpen = true; ui.rulesTab = tabM[1]; renderModal(); }
    else if (which === 'warlord') { handlers.state(STATES.turn); ui.mode = 'warlord'; render(); }
    else if (which === 'fx') {
      // Giả lập: lá bài đang được rê chuột + nhân vật vừa lộ diện (lật 3D)
      handlers.state(STATES.turn);
      const card = document.querySelectorAll('.fan .dcard')[1];
      card.style.setProperty('--ry', '9deg'); card.style.setProperty('--rx', '6deg');
      card.style.setProperty('--mx', '75%'); card.style.setProperty('--my', '25%'); card.classList.add('hov');
      ui.announceKey = 'x'; announce(STATES.turn.game);
    }
    else if (which === 'ability') { handlers.state(STATES.myturn); ui.abilityPopup = true; render(); }
    else if (which === 'chatbadge') { handlers.state(STATES.wait); ui.chatSeenAt = 0; render(); }
    else if (which === 'voice' || which === 'voicelobby') {
      // Thoại: bạn (p0) đang nói, Mai tắt micro, Bot Merlin… không có thoại
      const st = JSON.parse(JSON.stringify(which === 'voice' ? STATES.wait : STATES.lobby));
      st.room.members.forEach((m) => { if (m.id === 'p0') m.voice = 'on'; if (m.id === 'p3') { m.online = true; m.voice = 'muted'; } });
      Voice.on = true; Voice.peerState = () => 'connected'; Voice.speaking = new Set(['p0']);
      handlers.state(st);
    }
    else if (which === 'homesum') setTimeout(() => { const d = document.querySelector('.home details'); if (d) d.open = true; }, 1500);
    else if (which === 'logscroll') {
      // Kiểm tra nhật ký: giữ chỗ đang xem khi không có sự kiện mới; tự cuộn xuống khi có sự kiện mới
      // (nhật ký mặc định đóng → mở tab Nhật ký / bảng trượt Nhật ký trước)
      if (WIDE.matches) ui.sideTab = 'log'; else ui.sheet = 'log';
      handlers.state(STATES.wait);
      const L = () => document.querySelector('.log');
      const atBottom = () => L().scrollHeight - L().scrollTop - L().clientHeight < 5;
      setTimeout(() => {
        const r = [atBottom()];
        L().scrollTop = 0;
        handlers.state(STATES.wait);
        r.push(L().scrollTop === 0);
        const st = JSON.parse(JSON.stringify(STATES.wait));
        const last = st.game.log[st.game.log.length - 1];
        st.game.log.push({ ...last, id: last.id + 1, text: 'Sự kiện mới', en: 'New event', tone: 'gain' });
        handlers.state(st);
        setTimeout(() => { r.push(atBottom()); document.title = 'LOGTEST ' + r.join(','); }, 1500);
      }, 800);
    }    else if (which === 'touchtap') {
      // Kiểm tra chạm: lần 1 = phóng to xem (không xây), lần 2 = xây; chạm ra ngoài = hạ bài
      // Bảo đảm có lá xây được (trạng thái mẫu sinh ngẫu nhiên)
      const ST = JSON.parse(JSON.stringify(STATES.turn));
      if (ST.game.hand.length && ST.game.costs) ST.game.costs[ST.game.hand[0].id] = { cost: 0, why: null };
      handlers.state(ST);
      const sent = [];
      socket.emit = (...a) => sent.push(a);
      const tap = (el) => {
        const r = el.getBoundingClientRect();
        const o = { bubbles: true, cancelable: true, clientX: r.left + 20, clientY: r.top + 20 };
        el.dispatchEvent(new PointerEvent('pointerdown', { ...o, pointerType: 'touch' }));
        el.dispatchEvent(new MouseEvent('click', o));
      };
      setTimeout(() => {
        const card = document.querySelector('.fan .dcard.playable');
        if (!card) { document.title = 'TOUCHTEST no-playable-card'; return; }
        tap(card);
        const r = [card.classList.contains('hov'), sent.length === 0];
        tap(card);
        r.push(sent.length === 1 && sent[0][1] && sent[0][1].type === 'build');
        handlers.state(ST);
        const c2 = document.querySelector('.fan .dcard');
        tap(c2);
        tap(document.querySelector('.roundbar'));
        r.push(!document.querySelector('.fan .dcard.hov'));
        document.title = 'TOUCHTEST ' + r.join(',');
      }, 800);
    }    else if (which === 'lobbyleave') { handlers.state(STATES.lobby); ui.leaveArmed = true; render(); }
    else if (which === 'lobbychat') { handlers.state(STATES.lobby); ui.chatOpen = true; render(); }
    else if (which === 'sfx') {
      // Kiểm tra: phát đủ mọi tiếng không lỗi; nút 🔊 bấm → tắt (lưu lại), bấm lần nữa → bật
      handlers.state(STATES.turn);
      const r = [];
      document.dispatchEvent(new Event('pointerdown'));
      setTimeout(() => { try {
        ['turn', 'reveal', 'round', 'coin', 'coinLoss', 'build', 'attack', 'crown', 'finish', 'chat', 'tick'].forEach((n, i) => Sfx.play(n, i * 0.01)); r.push(Sfx.lastError ? 'err:' + Sfx.lastError : true);
        const btn = () => document.querySelector('[data-act="sfx"]');
        r.push(!!btn() && !Sfx.muted);
        btn().click(); r.push(Sfx.muted && btn().classList.contains('off'));
        btn().click(); r.push(!Sfx.muted);
        // Nhạc nền: đang ở phòng → phát; bấm 🎵 → dừng; bấm lại → phát
        const mb = () => document.querySelector('[data-act="music"]');
        r.push(Sfx.musicPlaying);
        mb().click(); r.push(!Sfx.musicPlaying && mb().classList.contains('off'));
        mb().click(); r.push(Sfx.musicPlaying);
      } catch (e) { r.push('err:' + e.message); } document.title = 'SFXTEST ' + r.join(','); }, 800);
    }
    else if (which === 'clock' || which === 'clockurgent' || which === 'clocktest') {
      // Đồng hồ lượt: người khác đang chơi (còn 45s) / lượt mình còn 7s (đỏ, tích tắc)
      const mine = which !== 'clock';
      const st = JSON.parse(JSON.stringify(mine ? STATES.turn : STATES.wait));
      st.room.deadlineIn = mine ? 7000 : 45000;
      st.room.turnTime = 90000;
      handlers.state(st);
      if (which === 'clocktest') {
        const r = [];
        const el = () => document.querySelector('.turn-clock');
        setTimeout(() => {
          r.push(!!el() && el().classList.contains('mine') && el().classList.contains('urgent'));
          r.push(['6', '7'].includes(el().querySelector('.tc-s').textContent));
          const st2 = JSON.parse(JSON.stringify(STATES.wait)); st2.room.deadlineIn = 75000; st2.room.turnTime = 90000;
          handlers.state(st2);
          r.push(!el().classList.contains('mine') && !el().classList.contains('urgent') && el().querySelector('.tc-s').textContent === '1:15');
          const st3 = JSON.parse(JSON.stringify(STATES.wait)); st3.room.deadlineIn = null;
          handlers.state(st3);
          r.push(!el());
          document.title = 'CLOCKTEST ' + r.join(',');
        }, 900);
      }
    }
    else if (which === 'orbit3d') {
      // Kéo chuột trên canvas phải xoay camera; lăn chuột phải đổi khoảng cách camera
      handlers.state(STATES.wait);
      setTimeout(() => {
        const sc = City3D._scene();
        const c = sc.renderer.domElement;
        const b = c.getBoundingClientRect();
        const cam = sc.camera.position;
        const p0 = cam.clone();
        const x = b.left + b.width * 0.5, y = b.top + b.height * 0.6;
        const pe = (type, dx) => c.dispatchEvent(new PointerEvent(type, { bubbles: true, pointerId: 3, pointerType: 'mouse', isPrimary: true, button: 0, buttons: type === 'pointerup' ? 0 : 1, clientX: x + dx, clientY: y }));
        pe('pointerdown', 0); for (let i = 1; i <= 10; i++) pe('pointermove', i * 15); pe('pointerup', 150);
        setTimeout(() => {
          const rot = cam.distanceTo(p0);
          const d0 = cam.distanceTo(sc.controls.target);
          c.dispatchEvent(new WheelEvent('wheel', { bubbles: true, cancelable: true, deltaY: 300, clientX: x, clientY: y }));
          setTimeout(() => {
            const d1 = cam.distanceTo(sc.controls.target);
            document.title = `ORBIT3D rotate=${rot.toFixed(2)} zoom=${d0.toFixed(1)}→${d1.toFixed(1)} enabled=${sc.controls.enabled} uiz=${document.documentElement.style.zoom || 1}`;
          }, 600);
        }, 600);
      }, 2500);
    }
    else if (which === 'probe3d') {
      // Bàn 3D: phần tử nằm trên cùng tại vài điểm trên canvas phải là chính canvas (không bị lớp khác che)
      handlers.state(STATES.wait);
      setTimeout(() => {
        const c = document.querySelector('.city3d canvas');
        if (!c) { document.title = 'PROBE3D no-canvas'; return; }
        const b = c.getBoundingClientRect();
        const pts = [[.5, .5], [.25, .7], [.75, .3], [.5, .85]].map(([fx, fy]) => {
          const el = document.elementFromPoint(b.left + b.width * fx, b.top + b.height * fy);
          return el === c ? 'ok' : (el ? `${el.tagName.toLowerCase()}.${String(el.className).split(' ').join('.')}` : 'null');
        });
        document.title = `PROBE3D ${pts.join(' | ')} | zoom=${document.documentElement.style.zoom || 1} | ta=${getComputedStyle(c.parentElement).touchAction}`;
      }, 2500);
    }
    else if (which === 'scrolltest') {
      // Phòng chờ cuộn xuống cuối (nút Bắt đầu) → vào ván: màn chơi phải ở đầu trang
      handlers.state(STATES.lobby);
      const r = [];
      setTimeout(() => {
        window.scrollTo(0, document.body.scrollHeight);
        r.push(window.scrollY > 50);
        const g = JSON.parse(JSON.stringify(STATES.wait)); g.game.gameId = 'g-new';
        handlers.state(g);
        setTimeout(() => {
          r.push(window.scrollY === 0);
          // Cùng ván, cập nhật thường: giữ nguyên chỗ cuộn
          window.scrollTo(0, 300);
          const g2 = JSON.parse(JSON.stringify(g)); handlers.state(g2);
          r.push(window.scrollY > 0);
          document.title = 'SCROLLTEST ' + r.join(',');
        }, 400);
      }, 800);
    }
    else if (which === 'autoendtest') {
      // Xong hết việc → tự kết thúc sau ~1.6s; "Ở lại" hủy; còn việc (kỹ năng) → không tự kết thúc, bảng lượt mở lại
      const sent = [];
      socket.emit = (ev, a) => sent.push(a && a.type);
      const done = JSON.parse(JSON.stringify(STATES.turn));
      const t = done.game.turn;
      Object.assign(t, { actionTaken: true, abilityUsed: true, incomeTaken: true, builds: t.maxBuilds, labUsed: true, smithyUsed: true, threat: false });
      handlers.state(done);
      const r = [];
      r.push(!!document.querySelector('.turn-dock.auto-end') && !document.querySelector('.turn-pop'));
      setTimeout(() => {
        r.push(sent.includes('endTurn'));
        sent.length = 0;
        // Lượt mới (giả lập): xong hết nhưng bấm "Ở lại" → không gửi
        const d2 = JSON.parse(JSON.stringify(done)); d2.game.round += 1; // lượt mới (khóa lượt đổi theo vòng)
        handlers.state(d2);
        document.querySelector('[data-act="autoEndStay"]').click();
        setTimeout(() => {
          r.push(!sent.includes('endTurn'));
          // Còn kỹ năng → không tự kết thúc, bảng lượt hiện kỹ năng
          const d3 = JSON.parse(JSON.stringify(done)); d3.game.round += 2; d3.game.turn.abilityUsed = false;
          handlers.state(d3);
          setTimeout(() => {
            r.push(!sent.includes('endTurn') && !document.querySelector('.turn-dock.auto-end'));
            document.title = 'AUTOENDTEST ' + r.join(',');
          }, 2000);
        }, 2000);
      }, 2000);
    }
    else if (which === 'rulessearch' || which === 'searchtest') {
      // Tìm trong Luật chơi & mẹo: không dấu vẫn ra, tô sáng, gõ không mất con trỏ, Esc xóa từ khóa
      handlers.state(STATES.wait);
      ui.rulesOpen = true; renderModal();
      const type = (v) => { const i = document.getElementById('rulesSearch'); i.focus(); i.value = v; i.dispatchEvent(new Event('input', { bubbles: true })); };
      setTimeout(() => {
        type('thu thue');
        if (which === 'rulessearch') return;
        const r = [];
        const groups = document.querySelectorAll('.modal-body .sr-group').length;
        r.push(groups >= 2 && !!document.querySelector('.modal-body mark'));
        r.push([...document.querySelectorAll('.modal-body mark')].some((m) => /thuế/i.test(m.textContent)));
        r.push(document.activeElement && document.activeElement.id === 'rulesSearch');
        type('ke trom');
        r.push([...document.querySelectorAll('.modal-body .sr-group h3')].some((h) => /Nhân vật/.test(h.textContent)) && /Kẻ trộm/.test(document.querySelector('.modal-body').textContent));
        type('zzzqqq');
        r.push(/Không tìm thấy/.test(document.querySelector('.modal-body').textContent));
        document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
        r.push(ui.rulesOpen && !document.getElementById('rulesSearch').value && !document.querySelector('.sr-group'));
        document.title = 'SEARCHTEST ' + r.join(',');
      }, 1500);
    }
    else if (which === 'lobbyjungle') {
      const st = JSON.parse(JSON.stringify(STATES.lobby));
      st.room.options.castMode = 'jungle';
      st.room.members.forEach((m, i) => { if (!m.isBot) m.avatar = ['witch', 'king', 'spy'][i % 3]; });
      handlers.state(st);
    }
    else if (which === 'avatarpick' || which === 'avatartest') {
      // Phòng chờ: bấm avatar của mình → bảng chọn; chọn → lưu máy + gửi server; avatar hiện bằng icon
      handlers.state(STATES.lobby);
      const sent = [];
      socket.emit = (ev, a) => sent.push([ev, a]);
      setTimeout(() => {
        document.querySelector('.seat .av-btn').click();
        if (which === 'avatarpick') return;
        const r = [];
        r.push(document.querySelectorAll('.av-grid .av-opt').length === 25);
        document.querySelector('.av-opt[data-av="witch"]').click();
        r.push(!document.querySelector('.av-pick') && localStorage.getItem('citadels-avatar') === 'witch');
        r.push(sent.some(([ev, a]) => ev === 'setAvatar' && a.avatar === 'witch'));
        // server gửi lại trạng thái có avatar → avatar của mình là icon, không còn chữ cái
        const st = JSON.parse(JSON.stringify(STATES.lobby));
        st.room.members.find((m) => m.id === st.you).avatar = 'witch';
        handlers.state(st);
        r.push(!!document.querySelector('.seat .av-btn .avatar svg'));
        localStorage.removeItem('citadels-avatar');
        document.title = 'AVATARTEST ' + r.join(',');
      }, 800);
    }
    else if (which === 'sidecities') { ui.sideTab = 'cities'; handlers.state(STATES.turn); ui.turnPopupHidden = true; render(); }
    else if (which === 'sheetcities') { handlers.state(STATES.wait); setTimeout(() => openCity(1), 300); }
    else if (which === 'sheetlog') { handlers.state(STATES.wait); ui.sheet = 'log'; render(); }
    else if (which === 'uxtest') {
      // Màn hẹp: bảng trượt Thành phố / Nhật ký, bảng tên 3D mở thành phố; màn rộng: tab cột phải. Cả hai: kéo lá lên bàn để xây
      // Trạng thái mẫu sinh ngẫu nhiên → bảo đảm có ≥ 2 lá xây được (đã nhận tài nguyên, chưa xây)
      const ux = JSON.parse(JSON.stringify(STATES.turn));
      Object.assign(ux.game.turn, { actionTaken: true, builds: 0, maxBuilds: Math.max(1, ux.game.turn.maxBuilds || 1) });
      ux.game.costs = Object.fromEntries(ux.game.hand.map((c) => [c.id, { cost: 1 }]));
      ui.turnPopupHidden = true;
      handlers.state(ux);
      ui.turnPopupHidden = true; render();
      const sent = [];
      socket.emit = (ev, a) => sent.push(a && a.type);
      const r = [];
      const $1 = (q) => document.querySelector(q);
      setTimeout(() => {
        const n = S.game.players.length;
        if (WIDE.matches) {
          // Mặc định đóng cả 2 tab; bấm Thành phố → mở; bấm lại → đóng
          const closed = !$1('.side-tabs .city-list') && !$1('.side-tabs .log');
          $1('[data-act="sideTab"][data-val="cities"]').click();
          r.push(closed && document.querySelectorAll('.side-tabs .city-list .cc-item').length === n);
          $1('[data-act="sideTab"][data-val="cities"]').click();
          if ($1('.side-tabs .city-list')) r.push('not-closed');
          $1('[data-act="sideTab"][data-val="log"]').click();
          r.push(!!$1('.side-tabs .log') && !$1('.side-tabs .city-list'));
          openCity(2);
          r.push(!!$1('.side-tabs .cc-item.focus[data-pi="2"]'));
        } else {
          $1('[data-act="sheet"][data-val="cities"]').click();
          r.push(document.querySelectorAll('.sheet .city-carousel .cc-item').length === n);
          $1('.sheet .sh-head').click(); // bấm trong bảng (không phải nút) → không đóng
          r.push(!!$1('.sheet'));
          $1('.sheet-bg').dispatchEvent(new MouseEvent('click', { bubbles: true }));
          r.push(!$1('.sheet'));
          openCity(2);
          r.push(!!$1('.sheet .cc-item.focus[data-pi="2"]'));
          $1('.sh-x').click();
          r.push(!$1('.sheet'));
        }
        // Kéo lá xây được lên bàn → gửi 'build'
        const card = $1('.hand-tray .fan .dcard.playable');
        if (!card) { r.push('no-playable'); document.title = 'UXTEST ' + r.join(','); return; }
        const b = card.getBoundingClientRect();
        const ev = (type, y) => document.dispatchEvent(new PointerEvent(type, { bubbles: true, pointerId: 7, pointerType: 'touch', clientX: b.left + b.width / 2, clientY: y, button: 0 }));
        card.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, pointerId: 7, pointerType: 'touch', clientX: b.left + b.width / 2, clientY: b.top + 30, button: 0 }));
        ev('pointermove', b.top + 10); ev('pointermove', b.top - 80); ev('pointermove', 120);
        r.push(!!$1('.drag-ghost.ok') && !!$1('.drop-hint.ok'));
        ev('pointerup', 120);
        r.push(sent.includes('build') && !$1('.drag-ghost'));
        // Kéo ít rồi thả trong khay → không xây
        sent.length = 0;
        const c2 = $1('.hand-tray .fan .dcard.playable');
        const b2 = c2.getBoundingClientRect();
        c2.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, pointerId: 8, pointerType: 'mouse', clientX: b2.left + 20, clientY: b2.top + 40, button: 0 }));
        document.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, pointerId: 8, pointerType: 'mouse', clientX: b2.left + 20, clientY: b2.top + 15 }));
        document.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, pointerId: 8, pointerType: 'mouse', clientX: b2.left + 20, clientY: b2.top + 15 }));
        r.push(!sent.includes('build'));
        document.title = 'UXTEST ' + r.join(',');
      }, 1200);
    }
    else if (which === 'perf') {
      // Đo bàn 3D: số khung/giây khi đứng yên, và khi giao diện vẽ lại mà bàn không đổi (không được vẽ dồn)
      handlers.state(STATES.wait);
      const frames = () => { const s = City3D._scene && City3D._scene(); return s ? s.renderer.info.render.frame : 0; };
      const r = [];
      setTimeout(() => {
        const f0 = frames();
        setTimeout(() => {
          r.push('idle=' + ((frames() - f0) / 2).toFixed(0));
          const f1 = frames();
          const iv = setInterval(() => render(), 250); // vẽ lại giao diện 4 lần/giây, bàn không đổi
          setTimeout(() => { clearInterval(iv); r.push('rerender=' + ((frames() - f1) / 2).toFixed(0)); document.title = 'PERFTEST ' + r.join(','); }, 2000);
        }, 2000);
      }, 7000);
    }
    else if (which === 'traymin') {
      // Kiểm tra: cuộn khỏi bàn 3D → khay thu gọn; cuộn lại → mở; tới lượt mình (có thanh điều khiển) → luôn mở
      handlers.state(STATES.wait);
      // + bấm viên "Bài trên tay" khi thu gọn → mở tạm (tray-peek); bấm lại / chạm ra ngoài → thu; về bàn → hết mở tạm
      const min = () => document.body.classList.contains('tray-min');
      const peek = () => document.body.classList.contains('tray-peek');
      const pill = () => document.querySelector('.hand-tray .tray-hint');
      const r = [];
      setTimeout(() => { r.push(!min()); window.scrollTo(0, document.body.scrollHeight); }, 1000);
      setTimeout(() => { r.push(min()); pill().click(); }, 2000);
      setTimeout(() => { r.push(peek() && !min()); pill().click(); }, 2400);
      setTimeout(() => { r.push(min() && !peek()); pill().click(); }, 2800);
      setTimeout(() => { r.push(peek()); document.querySelector('.layout').click(); }, 3200);
      setTimeout(() => { r.push(min() && !peek()); pill().click(); }, 3600);
      setTimeout(() => { r.push(peek()); window.scrollTo(0, 0); }, 4000);
      setTimeout(() => { r.push(!min() && !peek()); window.scrollTo(0, document.body.scrollHeight); }, 4600);
      setTimeout(() => { r.push(min() && !peek()); handlers.state(STATES.turn); }, 5200);
      setTimeout(() => { r.push(!min()); handlers.state(STATES.wait); window.scrollTo(0, 0); }, 6000);
      setTimeout(() => { r.push(!min()); document.title = 'TRAYTEST ' + r.join(','); }, 7000);
    }
    else if (which === 'traypeek') { // ảnh chụp: cuộn khỏi bàn rồi mở tạm khay bài
      handlers.state(STATES.wait);
      setTimeout(() => { window.scrollTo(0, document.body.scrollHeight); setTimeout(() => { updateTray(); document.querySelector('.hand-tray .tray-hint').click(); }, 400); }, 900);
    }
    else if (which === 'tokinfo') { handlers.state(STATES.wait); ui.tokInfo = 1; render(); }
    else if (which === 'chat') { handlers.state(STATES.wait); ui.chatOpen = true; render(); }
    else if (which === 'dock') { handlers.state(STATES.myturn); ui.turnPopupHidden = true; render(); }
    else if (which === 'logfresh') {
      // Lượt người khác: dải trạng thái mỏng + 4 dòng nhật ký cuối được đánh dấu là mới
      handlers.state(STATES.wait);
      const g = STATES.wait.game;
      ui.freshFrom = g.log[g.log.length - 1].id - 4; render(); // 4 dòng cuối được coi là mới
    }
    else if (which === 'relayout') {
      // Đổi sang ván khác (thứ tự người chơi khác) → bàn 3D dựng lại; nhãn tên không được nhân đôi
      handlers.state(STATES.turn);
      setTimeout(() => handlers.state(STATES.wait), 1500);
      setTimeout(() => { document.title = 'LABELS=' + document.querySelectorAll('.c3-label').length; }, 3000);
    }
    else if (!['home', 'homesum', 'logscroll', 'touchtap'].includes(which)) handlers.state(STATES[which]);
    // ?wheel=N: giả lập cuộn chuột N lần trên bàn 3D (âm = phóng to vào) để kiểm tra giới hạn phóng
    const wheelN = Number(new URLSearchParams(location.search).get('wheel') || 0);
    if (wheelN) setTimeout(() => {
      const cv = document.querySelector('.city3d canvas');
      for (let i = 0; i < Math.abs(wheelN); i++) cv.dispatchEvent(new WheelEvent('wheel', { deltaY: Math.sign(wheelN) * 100, bubbles: true, cancelable: true }));
      setTimeout(() => {
        const s = City3D._scene();
        const p = s.camera.position;
        const dbg = document.createElement('div');
        dbg.style.cssText = 'position:fixed;top:0;left:0;z-index:999;background:#000;color:#0f0;font:16px monospace;padding:6px';
        document.body.appendChild(dbg);
        dbg.textContent = document.title = `CAM${p.x.toFixed(1)},${p.y.toFixed(1)},${p.z.toFixed(1)} d=${p.distanceTo(s.controls.target).toFixed(1)} min=${s.controls.minDistance.toFixed(1)} max=${s.controls.maxDistance.toFixed(1)} fog=${s.scene.fog.near.toFixed(0)}-${s.scene.fog.far.toFixed(0)}`;
      }, 1500);
    }, 1500);
    // ?only3d: chỉ hiện khung 3D, phóng to để soi mô hình
    if (location.search.includes('only3d')) {
      const st = document.createElement('style');
      st.textContent = '.topbar,.side,.main > :not(.stage),.stage-action,.stage-tools{display:none!important} .layout{grid-template-columns:1fr!important} .city3d{height:' + (new URLSearchParams(location.search).get('h') || 900) + 'px!important}';
      document.head.appendChild(st);
    }
  </script>
</body>
</html>
