<!doctype html>
<!-- Mô phỏng màn hình thiết bị: nhúng preview.html vào khung đúng kích thước (Edge headless không cho cửa sổ hẹp hơn ~500px).
     Ví dụ: device.html?w=390&h=844#turn  (thêm &lang=en để xem tiếng Anh) -->
<html><head><meta charset="utf-8"></head>
<body style="margin:0;background:#000">
<iframe id="f" style="border:0;display:block"></iframe>
<script>
  const q = new URLSearchParams(location.search);
  const f = document.getElementById('f');
  f.style.width = (q.get('w') || 390) + 'px';
  f.style.height = (q.get('h') || 844) + 'px';
  f.src = 'preview.html' + (q.get('lang') ? '?lang=' + q.get('lang') : '') + location.hash;
</script>
</body></html>
